name: Portable desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frontend evidence gates
        run: npm test
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.13'
      - name: Isolated dependencies
        working-directory: gateway
        run: uv sync --frozen --group build
      - name: Protocol and API tests
        working-directory: gateway
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Windows source environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Start-Windows.ps1 -SetupOnly
      - name: macOS source environment
        if: runner.os == 'macOS'
        run: sh ./Start-macOS.command --setup-only
      - name: Source launcher smoke test with devices disabled
        if: runner.os == 'Windows'
        shell: pwsh
        run: gateway/.venv/Scripts/python.exe tools/runtime-smoke.py --output artifacts/source-smoke.json
      - name: macOS source launcher smoke test with devices disabled
        if: runner.os == 'macOS'
        run: gateway/.venv/bin/python tools/runtime-smoke.py --output artifacts/source-smoke.json
      - name: Build native application
        working-directory: gateway
        run: uv run --frozen pyinstaller package.spec --noconfirm --distpath ../artifacts/desktop
      - name: Validate macOS launcher and permissions manifest
        if: runner.os == 'macOS'
        run: |
          sh -n Start-macOS.command
          plutil -lint "artifacts/desktop/Neural Resonance.app/Contents/Info.plist"
      - name: Windows native runtime smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: gateway/.venv/Scripts/python.exe tools/runtime-smoke.py --native artifacts/desktop/NeuralResonance/NeuralResonance.exe --output artifacts/native-smoke.json
      - name: macOS native runtime smoke test
        if: runner.os == 'macOS'
        run: gateway/.venv/bin/python tools/runtime-smoke.py --native "artifacts/desktop/Neural Resonance.app/Contents/MacOS/NeuralResonance" --output artifacts/native-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-proof-${{ matrix.name }}
          path: artifacts/*smoke.json
      - name: Archive macOS application with permissions and symlinks
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/release
          ditto -c -k --sequesterRsrc --keepParent "artifacts/desktop/Neural Resonance.app" "artifacts/release/NeuralResonance-${{ matrix.name }}.zip"
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Compress-Archive -LiteralPath artifacts/desktop/NeuralResonance -DestinationPath "artifacts/release/NeuralResonance-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NeuralResonance-${{ matrix.name }}
          path: artifacts/release/
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/downloads
      - name: Publish portable applications
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/downloads/*/*.zip --clobber
          else
            gh release create "$TAG" artifacts/downloads/*/*.zip --title "Neural Resonance ${TAG#desktop-}" --notes-file docs/RELEASE-v0.11.2.md
          fi
