name: Compatibility regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - working-directory: gateway
        run: uv sync --frozen --no-dev --python ${{ matrix.python }}
      - working-directory: gateway
        shell: bash
        run: |
          if uv run --frozen --no-dev python -W error -m unittest discover -s tests -v > runtime-tests.log 2>&1; then
            cat runtime-tests.log
          else
            cat runtime-tests.log
            python -c 'from pathlib import Path; text=Path("runtime-tests.log").read_text(errors="replace")[-3500:]; print("::error title=Gateway regression::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Install private macOS source runtime
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: sh ./Start-macOS.command --setup-only
      - name: Verify macOS source startup
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: gateway/.venv/bin/python tools/runtime-smoke.py --output artifacts/source-smoke.json
      - name: Verify macOS offline relocation and restart
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: gateway/.venv/bin/python tools/portable-smoke.py --source --output artifacts/source-portable-smoke.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS' && matrix.python == '3.13'
        with:
          name: source-proof-${{ matrix.os }}
          path: artifacts/*smoke.json
  node:
    strategy:
      matrix:
        version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - run: npm test
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: ubuntu-latest
            engine: firefox
          - os: ubuntu-latest
            engine: webkit
          - os: macos-15
            engine: webkit
          - os: macos-15-intel
            engine: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.13'
      - working-directory: gateway
        run: uv sync --frozen --group audit
      - working-directory: gateway
        run: uv run --frozen --group audit playwright install --with-deps ${{ matrix.engine }}
      - run: gateway/.venv/bin/python tools/browser-audit.py --engine ${{ matrix.engine }} --output artifacts/browser-${{ matrix.engine }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.engine }}
          path: artifacts/browser-*
